# Replace makao.example.com with the real domain before enabling this file.
server {
    listen 80;
    listen [::]:80;
    server_name makao.example.com;

    root /var/www/makao;
    index index.html;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Optional test fallback for clients that need to bypass DNS.
# Replace 203.0.113.10 with the VM public IP and keep this HTTP-only.
server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10;

    root /var/www/makao;
    index index.html;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
